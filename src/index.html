<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ficoy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // set theme before first paint (mirrors src/app/theme.ts)
    try { var t = localStorage.getItem('ficoy-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t; document.documentElement.dataset.bsTheme = t; } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
